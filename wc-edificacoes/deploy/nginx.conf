# /etc/nginx/sites-available/wcedificacoes
# Depois: ln -s ../sites-available/wcedificacoes /etc/nginx/sites-enabled/ && certbot --nginx
limit_req_zone $binary_remote_addr zone=wc_api:10m rate=10r/s;
# Rotas sensíveis (login e formulário): limite bem mais baixo já na borda
limit_req_zone $binary_remote_addr zone=wc_sensitive:10m rate=10r/m;

server {
    listen 80;
    server_name wcedificacoes.com.br www.wcedificacoes.com.br;
    return 301 https://www.wcedificacoes.com.br$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.wcedificacoes.com.br wcedificacoes.com.br;

    # (o certbot preenche ssl_certificate / ssl_certificate_key)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;                 # não revela a versão do Nginx
    client_max_body_size 64k;          # formulários e JSON são pequenos; o upload de fotos tem rota própria
    client_body_timeout 30s;
    client_header_timeout 15s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml application/manifest+json;

    # Upload de fotos do painel: único lugar que aceita corpos grandes (10 fotos de até 8 MB)
    location ~ ^/api/admin/projects/\d+/images$ {
        client_max_body_size 90m;
        client_body_timeout 120s;
        limit_req zone=wc_api burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location ~ ^/api/(auth/login|quotes)$ {
        limit_req zone=wc_sensitive burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=wc_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # substitui (não concatena) o valor do cliente
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Nunca servir arquivos ocultos (.env, .git)
    location ~ /\. { deny all; return 404; }
}
